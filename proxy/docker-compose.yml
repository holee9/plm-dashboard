services:
  plm-proxy:
    image: nginx:alpine
    container_name: plm-dashboard-proxy
    network_mode: host
    environment:
      - OP_AUTH_B64=${OP_AUTH_B64}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/tracked.js:/etc/nginx/njs/tracked.js:ro
      - ../design_handoff_plm_dashboard:/dashboard:ro
      # 주요 과제 선택 (#110): the only writable directory (host dir must exist and be writable by uid 101; see README)
      - ../design_handoff_plm_dashboard/data/config:/dashboard/data/config:rw
    restart: unless-stopped
